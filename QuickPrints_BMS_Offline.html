<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#b91c1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quick Prints BMS">
<title>Quick Prints BMS</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #111318;
  --bg2: #1a1d24;
  --bg3: #222730;
  --bg4: #2a2f3a;
  --border: #2e3340;
  --border2: #3a4050;
  --text: #e8eaf0;
  --text2: #9ba3b8;
  --text3: #5a6280;
  --accent: #b91c1c;
  --accent2: #dc2626;
  --accent-dim: rgba(185,28,28,0.16);
  --green: #16a34a;
  --green-dim: rgba(22,163,74,0.14);
  --red: #dc2626;
  --red-dim: rgba(220,38,38,0.14);
  --blue: #1d4ed8;
  --blue-dim: rgba(29,78,216,0.14);
  --yellow: #d97706;
  --yellow-dim: rgba(217,119,6,0.16);
  --purple: #7c3aed;
  --purple-dim: rgba(124,58,237,0.14);
  --teal: #0d9488;
  --teal-dim: rgba(13,148,136,0.14);
  --orange: #ea580c;
  --orange-dim: rgba(234,88,12,0.14);
  --sidebar-w: 220px;
  --topbar-h: 48px;
  --radius: 6px;
  --font: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif;
  --mono: 'IBM Plex Mono', 'Courier New', monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
body.theme-light{
  --bg:#f0f2f5;
  --bg2:#ffffff;
  --bg3:#f5f6f8;
  --bg4:#eceef1;
  --border:#e2e5ea;
  --border2:#d0d5dd;
  --text:#1a1d23;
  --text2:#5a6070;
  --text3:#9099a8;
  --accent:#b91c1c;
  --accent2:#dc2626;
  --accent-dim:rgba(185,28,28,0.12);
  --green:#16a34a;
  --green-dim:rgba(22,163,74,0.12);
  --red:#dc2626;
  --red-dim:rgba(220,38,38,0.12);
  --blue:#1d4ed8;
  --blue-dim:rgba(29,78,216,0.12);
  --yellow:#d97706;
  --yellow-dim:rgba(217,119,6,0.14);
  --purple:#7c3aed;
  --purple-dim:rgba(124,58,237,0.12);
  --teal:#0d9488;
  --teal-dim:rgba(13,148,136,0.12);
  --orange:#ea580c;
  --orange-dim:rgba(234,88,12,0.12);
}
a{color:inherit;text-decoration:none;}
button{font-family:var(--font);cursor:pointer;border:none;outline:none;}
input,select,textarea{font-family:var(--font);outline:none;}

/* LOADING */
#loading{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;}
.loader-logo{font-size:28px;font-weight:700;letter-spacing:2px;color:var(--accent);}
.loader-logo span{color:var(--text2);}
.loader-bar{width:200px;height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;}
.loader-bar-fill{height:100%;background:var(--accent);border-radius:2px;animation:loadfill 1.8s ease-in-out infinite;}
@keyframes loadfill{0%{width:0%;margin-left:0}50%{width:70%}100%{width:0%;margin-left:100%}}
.loader-text{font-size:12px;color:var(--text3);font-family:var(--mono);}

/* LOGIN */
#login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#1e2227 0%,#2d333b 100%);z-index:9998;display:flex;align-items:center;justify-content:center;}
.login-box{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:40px;width:380px;max-width:90vw;box-shadow:0 24px 80px rgba(0,0,0,.35);}
.login-logo{text-align:center;margin-bottom:32px;}
.login-logo h1{font-size:24px;font-weight:700;color:var(--accent);letter-spacing:1px;}
.login-logo p{font-size:12px;color:var(--text3);margin-top:4px;font-family:var(--mono);}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
.form-group input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;color:var(--text);font-size:14px;transition:border-color .2s;}
.form-group input:focus{border-color:var(--accent);}
.password-wrap{position:relative;}
.password-wrap input{padding-right:42px;}
.password-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;}
.password-toggle:hover{color:var(--text);border-color:var(--border2);}
.btn-login{width:100%;background:var(--accent);color:#fff;font-weight:600;font-size:14px;padding:11px;border-radius:var(--radius);margin-top:8px;transition:background .2s;}
.btn-login:hover{background:var(--accent2);}
.login-err{color:var(--red);font-size:12px;text-align:center;margin-top:10px;display:none;}


/* LAYOUT */
#app{display:none;min-height:100vh;}
#sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);background:#1e2227;border-right:none;display:flex;flex-direction:column;z-index:100;overflow-y:auto;box-shadow:2px 0 8px rgba(0,0,0,.12);}
#nav-menu{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:10px;}
.sidebar-logo{padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;background:#1e2227;}
.sidebar-logo h2{font-size:15px;font-weight:700;color:var(--accent);letter-spacing:.5px;}
.sidebar-logo p{font-size:10px;color:rgba(255,255,255,.4);margin-top:2px;font-family:var(--mono);}
.sidebar-user{padding:12px 18px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;background:#1a1e23;}
.sidebar-user .u-name{font-size:13px;font-weight:600;color:var(--text);}
.sidebar-user .u-role{font-size:11px;color:var(--text3);margin-top:2px;}
.nav-section{padding:8px 0;}
.nav-label{font-size:10px;font-weight:700;color:rgba(255,255,255,.34);text-transform:uppercase;letter-spacing:.08em;padding:7px 14px 5px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;font-size:13px;color:rgba(255,255,255,.55);cursor:pointer;transition:all .15s;border-left:3px solid transparent;border-radius:var(--radius);margin:0 8px 1px;}
.nav-item:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.9);}
.nav-item.active{background:rgba(185,28,28,.18);color:#ffffff;border-left-color:var(--accent);font-weight:600;padding-left:9px;}
.nav-item .nav-icon{font-size:14px;width:16px;text-align:center;}
.sidebar-bottom{margin-top:auto;padding:12px 18px;border-top:1px solid var(--border);flex-shrink:0;}
.sync-status{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3);}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.sync-dot.syncing{animation:pulse .8s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

#topbar{position:fixed;left:var(--sidebar-w);right:0;top:0;height:var(--topbar-h);background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:8px;z-index:99;box-shadow:0 1px 4px rgba(0,0,0,.12);}
.topbar-title{font-size:13px;font-weight:700;color:var(--text);flex:1;}
.branch-select{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:5px 9px;color:var(--text);font-size:12px;cursor:pointer;height:30px;}
.btn-sync{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:5px 9px;color:var(--text2);font-size:12px;transition:all .15s;height:30px;display:inline-flex;align-items:center;}
.btn-sync:hover{color:var(--text);border-color:var(--border2);}
.api-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.3px;border:1px solid transparent;white-space:nowrap;}
.api-pill::before{content:'';width:7px;height:7px;border-radius:50%;display:inline-block;}
.api-online{color:var(--green);background:var(--green-dim);border-color:rgba(34,197,94,.25);}
.api-online::before{background:var(--green);}
.api-offline{color:var(--red);background:var(--red-dim);border-color:rgba(239,68,68,.3);}
.api-offline::before{background:var(--red);}
.notif-btn{position:relative;background:none;border:none;color:var(--text2);font-size:16px;cursor:pointer;}
.notif-badge{position:absolute;top:-3px;right:-3px;background:var(--accent);color:#fff;font-size:9px;font-weight:700;border-radius:50%;width:14px;height:14px;display:flex;align-items:center;justify-content:center;}
.btn-logout{background:none;border:1px solid var(--border);border-radius:var(--radius);padding:5px 10px;color:var(--text3);font-size:12px;transition:all .15s;height:30px;display:inline-flex;align-items:center;}
.btn-logout:hover{border-color:var(--red);color:var(--red);}

#main{margin-left:var(--sidebar-w);margin-top:var(--topbar-h);padding:24px;min-height:calc(100vh - var(--topbar-h));}

/* CARDS & COMMON */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.card-title{font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.page-title{font-size:20px;font-weight:700;color:var(--text);}
.page-subtitle{font-size:12px;color:var(--text3);margin-top:2px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}


/* STAT CARDS */
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:16px 18px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.stat-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.stat-value{font-size:26px;font-weight:700;color:var(--text);font-family:var(--mono);}
.stat-value.accent{color:var(--accent);}
.stat-value.green{color:var(--green);}
.stat-value.red{color:var(--red);}
.stat-value.blue{color:var(--blue);}
.stat-sub{font-size:11px;color:var(--text3);margin-top:4px;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;border:none;}
.btn-primary{background:var(--accent);color:#fff;}.btn-primary:hover{background:var(--accent2);}
.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border);}.btn-secondary:hover{border-color:var(--border2);}
.btn-danger{background:var(--red-dim);color:var(--red);border:1px solid transparent;}.btn-danger:hover{background:var(--red);color:#fff;}
.btn-success{background:var(--green-dim);color:var(--green);border:1px solid transparent;}.btn-success:hover{background:var(--green);color:#fff;}
.btn-sm{padding:4px 10px;font-size:12px;}
.btn-icon{padding:6px;width:30px;height:30px;justify-content:center;}

/* TABLE */
.tbl-wrap{overflow-x:auto;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
table{width:100%;border-collapse:collapse;}
th{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;padding:8px 12px;border-bottom:1px solid var(--border);text-align:left;background:var(--bg2);}
td{font-size:13px;color:var(--text);padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:hover td{background:var(--bg3);}
tr:last-child td{border-bottom:none;}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap;border:1px solid transparent;letter-spacing:.02em;}
.badge-orange{background:var(--orange-dim);color:var(--orange);border-color:rgba(234,88,12,.25);}
.badge-green{background:var(--green-dim);color:var(--green);border-color:rgba(22,163,74,.25);}
.badge-red{background:var(--red-dim);color:var(--red);border-color:rgba(220,38,38,.25);}
.badge-blue{background:var(--blue-dim);color:var(--blue);border-color:rgba(29,78,216,.25);}
.badge-yellow{background:var(--yellow-dim);color:var(--yellow);border-color:rgba(217,119,6,.25);}
.badge-purple{background:var(--purple-dim);color:var(--purple);border-color:rgba(124,58,237,.25);}
.badge-gray{background:var(--bg4);color:var(--text3);border-color:var(--border);}

/* FORM ELEMENTS */
.form-row{display:grid;gap:14px;margin-bottom:14px;}
.form-row.cols-2{grid-template-columns:1fr 1fr;}
.form-row.cols-3{grid-template-columns:1fr 1fr 1fr;}
.fld label{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}
.fld input,.fld select,.fld textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;color:var(--text);font-size:13px;transition:border-color .2s;}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);}
.fld select{cursor:pointer;}
.fld textarea{resize:vertical;min-height:80px;}
.fld select option{background:var(--bg2);}

/* MODAL */
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center;padding:20px;}
#modal-overlay.open{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:14px;width:100%;max-width:640px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.22);}
.modal.modal-lg{max-width:880px;}
.modal.modal-sm{max-width:420px;}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0;}
.modal-title{font-size:15px;font-weight:600;color:var(--text);}
.modal-close{background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;line-height:1;}.modal-close:hover{color:var(--text);}
.modal-body{padding:20px;overflow-y:auto;flex:1;}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;flex-shrink:0;}

/* SEARCH / FILTER BAR */
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.search-input{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:7px 12px;color:var(--text);font-size:13px;min-width:200px;}.search-input:focus{border-color:var(--accent);}
.filter-select{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:7px 10px;color:var(--text);font-size:13px;cursor:pointer;}

/* STAGE PILLS */
.stage-waiting{background:var(--blue-dim);color:var(--blue);border:1px solid rgba(29,78,216,.2);}
.stage-designing{background:var(--purple-dim);color:var(--purple);border:1px solid rgba(124,58,237,.2);}
.stage-approval{background:rgba(14,165,233,.14);color:#0369a1;border:1px solid rgba(14,165,233,.25);}
.stage-printing{background:var(--teal-dim);color:var(--teal);border:1px solid rgba(13,148,136,.25);}
.stage-fabrication{background:var(--orange-dim);color:var(--orange);border:1px solid rgba(234,88,12,.25);}
.stage-ready{background:var(--green-dim);color:var(--green);border:1px solid rgba(22,163,74,.25);}
.stage-installed{background:rgba(6,182,212,.14);color:#0e7490;border:1px solid rgba(6,182,212,.25);}
.stage-paid{background:var(--green-dim);color:var(--green);border:1px solid rgba(22,163,74,.25);}


/* KANBAN */
.kanban-wrap{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;}
.kanban-col{flex-shrink:0;width:230px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;max-height:calc(100vh - 160px);}
.kanban-col-header{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.kanban-col-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
.kanban-col-count{font-size:11px;color:var(--text3);background:var(--bg4);padding:1px 7px;border-radius:20px;}
.kanban-cards{padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;flex:1;}
.k-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;cursor:pointer;transition:border-color .15s;}
.k-card:hover{border-color:var(--border2);}
.k-card-id{font-size:10px;color:var(--text3);font-family:var(--mono);margin-bottom:3px;}
.k-card-title{font-size:12px;font-weight:600;color:var(--text);margin-bottom:6px;line-height:1.4;}
.k-card-client{font-size:11px;color:var(--text2);}
.k-card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:8px;}
.k-card-amount{font-size:11px;font-family:var(--mono);color:var(--accent);}
.priority-dot{width:7px;height:7px;border-radius:50%;}
.priority-high{background:var(--red);}
.priority-medium{background:var(--yellow);}
.priority-low{background:var(--green);}

/* TIMELINE / HISTORY */
.timeline{display:flex;flex-direction:column;gap:0;}
.tl-item{display:flex;gap:12px;padding:10px 0;position:relative;}
.tl-item:not(:last-child)::after{content:'';position:absolute;left:14px;top:30px;bottom:0;width:1px;background:var(--border);}
.tl-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:6px;}
.tl-content{flex:1;}
.tl-action{font-size:13px;color:var(--text);}
.tl-meta{font-size:11px;color:var(--text3);margin-top:2px;}

/* DASHBOARD SPECIFIC */
.activity-item{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);}
.activity-item:last-child{border-bottom:none;}
.activity-icon{width:32px;height:32px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.activity-text{flex:1;font-size:13px;color:var(--text);}
.activity-time{font-size:11px;color:var(--text3);}

/* TABS */
.tabs{display:flex;gap:2px;background:var(--bg3);border-radius:var(--radius);padding:3px;margin-bottom:20px;border:1px solid var(--border);}
.tab-item{padding:6px 14px;border-radius:4px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;transition:all .15s;}
.tab-item.active{background:var(--bg2);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.3);}

/* QUOTE BUILDER */
.quote-item-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 30px;gap:8px;align-items:center;margin-bottom:8px;}

/* MESSAGES */
.msg-layout{display:grid;grid-template-columns:240px 1fr;height:calc(100vh - var(--topbar-h) - 48px);gap:0;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.msg-list{border-right:1px solid var(--border);overflow-y:auto;}
.msg-list-item{padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;}
.msg-list-item:hover,.msg-list-item.active{background:var(--bg3);}
.msg-list-item.unread .msg-preview{color:var(--text);}
.msg-from{font-size:13px;font-weight:600;color:var(--text);}
.msg-subject{font-size:12px;color:var(--text2);margin-top:2px;}
.msg-preview{font-size:11px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.msg-pane{display:flex;flex-direction:column;}
.msg-pane-header{padding:16px 20px;border-bottom:1px solid var(--border);}
.msg-pane-body{padding:20px;flex:1;overflow-y:auto;font-size:14px;color:var(--text2);line-height:1.7;}
.msg-pane-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:14px;}

/* CALENDAR */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-day-label{text-align:center;font-size:11px;font-weight:600;color:var(--text3);padding:4px 0;text-transform:uppercase;}
.cal-day{background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:6px;min-height:70px;font-size:12px;color:var(--text2);}
.cal-day.today{border-color:var(--accent);}
.cal-day-num{font-size:11px;font-weight:600;margin-bottom:4px;}
.cal-event{font-size:10px;background:var(--accent-dim);color:var(--accent);border-radius:3px;padding:1px 4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* REPORTS */
.report-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;}
.bar-chart{display:flex;flex-direction:column;gap:8px;}
.bar-row{display:flex;align-items:center;gap:10px;}
.bar-label{font-size:12px;color:var(--text2);width:100px;text-align:right;flex-shrink:0;}
.bar-track{flex:1;background:var(--bg4);border-radius:3px;height:22px;overflow:hidden;}
.bar-fill{height:100%;background:var(--accent);border-radius:3px;display:flex;align-items:center;padding:0 8px;font-size:11px;color:#fff;font-weight:600;transition:width .6s ease;}
.bar-val{font-size:12px;color:var(--text2);width:70px;font-family:var(--mono);}

/* EMPTY STATE */
.empty-state{text-align:center;padding:48px 20px;color:var(--text3);}
.empty-state .empty-icon{font-size:36px;margin-bottom:12px;}
.empty-state p{font-size:14px;}

/* SCROLLBAR */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}

/* PRIORITY BADGE */
.p-high{color:var(--red);font-size:11px;font-weight:700;}
.p-medium{color:var(--yellow);font-size:11px;font-weight:700;}
.p-low{color:var(--green);font-size:11px;font-weight:700;}

/* AVATAR */
.avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}

/* ALERT */
.alert{padding:10px 14px;border-radius:var(--radius);font-size:13px;margin-bottom:14px;}
.alert-info{background:var(--blue-dim);color:var(--blue);border:1px solid rgba(59,130,246,.2);}
.alert-warn{background:var(--yellow-dim);color:var(--yellow);border:1px solid rgba(234,179,8,.2);}
.alert-danger{background:var(--red-dim);color:var(--red);border:1px solid rgba(239,68,68,.2);}
.alert-success{background:var(--green-dim);color:var(--green);border:1px solid rgba(34,197,94,.2);}

/* TOAST */
#toast{position:fixed;bottom:20px;right:20px;z-index:9000;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.toast-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 16px;font-size:13px;color:var(--text);box-shadow:0 4px 20px rgba(0,0,0,.5);transform:translateX(0);transition:all .3s;pointer-events:all;display:flex;align-items:center;gap:8px;}
.toast-item.toast-success{border-left:3px solid var(--green);}
.toast-item.toast-error{border-left:3px solid var(--red);}
.toast-item.toast-info{border-left:3px solid var(--blue);}
.toast-item.leaving{opacity:0;transform:translateX(20px);}


/* MOBILE BOTTOM NAV */
.mobile-nav{display:none;}

/* RESPONSIVE */
@media(max-width:768px){
  :root{--sidebar-w:0px;}
  #sidebar{transform:translateX(-220px);transition:transform .3s;}
  #sidebar.open{transform:translateX(0);width:220px;}
  #main{padding:14px 12px 96px;}
  #topbar{padding:0 8px;gap:6px;}
  .topbar-title{font-size:12px;}
  .branch-select{max-width:116px;font-size:11px;padding:4px 6px;height:28px;}
  .btn-sync,.btn-logout{height:28px;padding:4px 7px;}
  #api-status{display:none;}
  .mobile-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:120;
    display:grid;
    grid-template-columns:repeat(5,minmax(0,1fr));
    gap:0;
    background:#1e2227;
    border-top:1px solid rgba(255,255,255,.08);
    padding:4px 0 env(safe-area-inset-bottom,4px);
    box-shadow:0 -6px 18px rgba(0,0,0,.28);
  }
  .mobile-nav button{
    background:transparent;
    color:rgba(255,255,255,.45);
    font-size:9px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.05em;
    padding:6px 2px;
    display:flex;
    flex-direction:column;
    align-items:center;

    gap:2px;

  }
  .mobile-nav button.active{color:#f87171;background:rgba(185,28,28,.14);}
  .mobile-nav .ico{font-size:18px;line-height:1;}
}

@media(hover:none){
  .btn{min-height:36px;}
  .nav-item{min-height:42px;}
  input,select,textarea{min-height:40px;font-size:16px;}
}

<script>
// ============================================================
// STATE
// ============================================================
const S = {
  user: null, page: 'dashboard', modal: null, modalData: null,
  jobFilter: 'all', jobSearch: '', branch: 'all',
  themeMode: localStorage.getItem('qp_theme') || 'dark',
  apiOnline: false,
  retryQueue: (() => {
    try { return JSON.parse(localStorage.getItem('qp_retry_queue') || '[]'); }
    catch { return []; }
  })(),
  retryFlushing: false,
  jobs: [], clients: [], staff: [], salesLog: [], inventory: [],
  suppliers: [], quotes: [], leads: [], commissions: [],
  payroll: [], pettyCash: [], opex: [], assets: [], recurring: [],
  procurement: [], messages: [], notifications: [], attendanceRecords: [],
  settings: {},
  hashBound: false
};

// ============================================================
// API
// ============================================================
const API = {
  base: '/bms/api',
  token() { return localStorage.getItem('qp_token'); },
  headers() {
    const t = this.token();
    const h = { 'Content-Type': 'application/json' };
    if (t) h.Authorization = `Bearer ${t}`;
    return h;
  },
  async req(method, path, body) {
    if (!navigator.onLine) {
      setApiStatus(false);
      return null;
    }
    try {
      const ctrl = new AbortController();
      const tid = setTimeout(() => ctrl.abort(), 10000);
      const r = await fetch(this.base + path, {
        method, headers: this.headers(),
        body: body ? JSON.stringify(body) : undefined,
        signal: ctrl.signal
      });
      clearTimeout(tid);
      setApiStatus(true);
      if (r.status === 401) { logout(); return null; }
      if (!r.ok) return null;
      try { return await r.json(); }
      catch { return {}; }
    } catch(e) {
      setApiStatus(false);
      return null;
    }
  },
  get(p) { return this.req('GET', p); },
  post(p, b) { return this.req('POST', p, b); },
  put(p, b) { return this.req('PUT', p, b); },
  del(p) { return this.req('DELETE', p); }
};

// ============================================================
// AUTH
// ============================================================
// Offline credentials (demo mode)
const OFFLINE_USERS = [
  { email: 'admin@quickprints.co.ke',   password: 'Admin@2024',  name: 'James Mwangi',  role: 'Admin',             branch: 'all' },
  { email: 'gm@quickprints.co.ke',      password: 'Admin@2024',  name: 'Mary Wanjiku',  role: 'General Manager',   branch: 'all' },
  { email: 'ops@quickprints.co.ke',     password: 'Admin@2024',  name: 'Peter Kamau',   role: 'Operations Manager',branch: 'Westlands' },
  { email: 'grace@quickprints.co.ke',   password: 'Admin@2024',  name: 'Grace Achieng', role: 'Receptionist',      branch: 'CBD' },
  { email: 'david@quickprints.co.ke',   password: 'Admin@2024',  name: 'David Ochieng', role: 'Designer',          branch: 'Westlands' },
  { email: 'sarah@quickprints.co.ke',   password: 'Admin@2024',  name: 'Sarah Njeri',   role: 'Sales',             branch: 'Karen' },
];

async function doLogin() {
  const email = document.getElementById('login-email').value.trim().toLowerCase();
  const pass = document.getElementById('login-pass').value;
  const errEl = document.getElementById('login-err');
  errEl.style.display = 'none';
  if (!email || !pass) {
    errEl.textContent = 'Enter email and password.';
    errEl.style.display = 'block';
    return;
  }

  // Offline mode: match against local credentials
  const offlineUser = OFFLINE_USERS.find(u => u.email === email && u.password === pass);
  if (offlineUser) {
    const userData = { name: offlineUser.name, role: offlineUser.role, branch: offlineUser.branch, email: offlineUser.email };
    localStorage.setItem('qp_token', 'offline-token');
    localStorage.setItem('qp_user', JSON.stringify(userData));
    S.token = 'offline-token';
    S.user = userData;
    setApiStatus(false);
    auditLog('User logged in (offline)');
    startApp();
    return;
  }

  // Try live API if online
  try {
    const r = await fetch('/bms/api/auth/login', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email, password: pass })
    });
    const d = await r.json();
    if (d.token) {
      const userData = d.user || { name: 'Admin', role: 'Admin', branch: 'all', email };
      localStorage.setItem('qp_token', d.token);
      localStorage.setItem('qp_user', JSON.stringify(userData));
      S.token = d.token;
      S.user = userData;
      setApiStatus(true);
      auditLog('User logged in');
      startApp();
    } else { errEl.style.display = 'block'; }
  } catch(e) {
    errEl.textContent = 'Invalid credentials. Please try again.';
    errEl.style.display = 'block';
  }
}

function logout() {
  auditLog('User logged out');
  localStorage.removeItem('qp_token');
  localStorage.removeItem('qp_user');
  S.user = null;
  S.page = 'dashboard';
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('loading').style.display = 'none';
  const errEl = document.getElementById('login-err');
  if (errEl) errEl.style.display = 'none';
  const passEl = document.getElementById('login-pass');
  if (passEl) passEl.value = '';
  history.replaceState(null, '', window.location.pathname + window.location.search + '#/login');
}

// ============================================================
// STARTUP
// ============================================================
async function startup() {
  if (startPortalModeFromUrl()) return;
  document.getElementById('loading').style.display = 'flex';
  const msgs = ['Validating session...','Loading jobs...','Loading clients...','Ready.'];
  let mi = 0;
  const ltxt = document.getElementById('loader-text');
  const iv = setInterval(() => { if(mi < msgs.length) ltxt.textContent = msgs[mi++]; }, 400);
  await new Promise(r => setTimeout(r, 1800));
  clearInterval(iv);
  const token = localStorage.getItem('qp_token');
  const userStr = localStorage.getItem('qp_user');
  document.getElementById('loading').style.display = 'none';
  if (!token || !userStr) {
    document.getElementById('login-screen').style.display = 'flex';
    return;
  }
  try {
    S.user = JSON.parse(userStr);
  } catch {
    localStorage.removeItem('qp_token');
    localStorage.removeItem('qp_user');
    document.getElementById('login-screen').style.display = 'flex';
    return;
  }
  startApp();
}

async function startApp() {
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('loader-text').textContent = 'Loading workspace...';
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('sidebar-uname').textContent = S.user.name || 'User';
  document.getElementById('sidebar-urole').textContent = S.user.role || '';
  applyTheme(S.themeMode);
  setApiStatus(navigator.onLine);
  const didHydrate = await hydrateFromApi();
  if (!didHydrate) {
    loadDemoData();
  }
  applyRoleUiConstraints();
  buildNav();
  buildMobileNav();
  updateApiBadge();
  registerPWA();
  bindHashRouting();
  applyRouteFromHash();
  checkApiHealth();
  flushRetryQueue();
  setInterval(syncNow, 30000);
  setInterval(checkApiHealth, 15000);
  setInterval(flushRetryQueue, 7000);
  window.addEventListener('online', () => {
    setApiStatus(true);
    checkApiHealth();
    flushRetryQueue();
  });
  window.addEventListener('offline', () => setApiStatus(false));
  document.getElementById('loading').style.display = 'none';
}

function startPortalModeFromUrl() {
  const token = new URLSearchParams(window.location.search).get('portal');
  if (!token) return false;
  try {
    const payload = JSON.parse(atob(token));
    if (!payload?.cid) return false;
    if (!S.clients.length || !S.jobs.length) loadDemoData();
    const cl = S.clients.find(c => String(c.id) === String(payload.cid));
    if (!cl) return false;
    const jobs = S.jobs.filter(j => String(j.client_id) === String(cl.id));
    document.getElementById('loading').style.display = 'none';
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'none';
    document.body.style.overflow = 'auto';
    document.body.innerHTML = `<div style="max-width:980px;margin:0 auto;padding:20px">${renderPortalHTML(cl, jobs, payload.level || 'jobs')}</div>`;
    return true;
  } catch {
    return false;
  }
}

async function hydrateFromApi() {
  const map = {
    jobs: '/jobs',
    clients: '/clients',
    staff: '/staff',
    salesLog: '/saleslog',
    quotes: '/quotes',
    leads: '/leads',
    inventory: '/inventory',
    opex: '/finance/opex',
    payroll: '/finance/payroll',
    pettyCash: '/finance/pettycash',
    assets: '/finance/assets',
    procurement: '/finance/procurement'
  };

  let loaded = 0;
  for (const [stateKey, apiPath] of Object.entries(map)) {
    const rows = await API.get(apiPath);
    if (Array.isArray(rows)) {
      S[stateKey] = rows;
      loaded++;
    }
  }

  if (loaded > 0) {
    setApiStatus(true);
    return true;
  }

  return false;
}

const PERM = {
  fullDashboard: ['Admin','General Manager','Operations Manager'],
  salesAdmin: ['Admin','General Manager','Receptionist'],
  salesLog: ['Admin','General Manager','Receptionist','Sales'],
  finance: ['Admin','General Manager'],
  hr: ['Admin','General Manager'],
  allBranches: ['Admin','General Manager']
};
function can(p) { return S.user && PERM[p] && PERM[p].includes(S.user.role); }
function isRole(...roles) { return roles.includes(S.user?.role); }

const ROLE_PAGE_ACCESS = {
  'General Manager': ['jobs','saleslog','quotes','leads','followups','clients','reports'],
  'Operations Manager': ['dashboard','jobs','kanban','designer','operator','fabrication','maintenance','delivery','inventory','suppliers','purchase-orders','services','clients','reports','audit-log'],
  'Receptionist': ['dashboard','jobs','saleslog','quotes','leads','followups','clients','messages','notifications','reports'],
  'Designer': ['designer'],
  'Operator': ['operator','fabrication'],
  'Fabrication Staff': ['operator','fabrication'],
  'Welder': ['operator','fabrication'],
  'CNC Operator': ['operator','fabrication'],
  'Laser Operator': ['operator','fabrication']
};

function normalizeRole(role) {
  if (!role) return 'Admin';
  if (['Fabrication Staff','Welder','CNC Operator','Laser Operator'].includes(role)) return role;
  return role;
}

function canAccessPage(page) {
  if (!S.user) return false;
  const role = normalizeRole(S.user.role);
  if (role === 'Admin') return true;
  const allowed = ROLE_PAGE_ACCESS[role];
  if (!allowed) return true;
  return allowed.includes(page);
}

function canManagePayments() {
  return isRole('Admin','General Manager','Operations Manager','Receptionist');
}

function canEditAnyJob() {
  return isRole('Admin','General Manager','Operations Manager','Receptionist');
}

function canDesignerAdvance(stage) {
  return isRole('Designer') && ['approval','printing'].includes(stage);
}

function canOperatorAdvance(stage) {
  return isRole('Operator','Fabrication Staff','Welder','CNC Operator','Laser Operator') && ['fabrication','ready'].includes(stage);
}

function defaultPageForRole() {
  const role = normalizeRole(S.user?.role);
  if (role === 'Designer') return 'designer';
  if (['Operator','Fabrication Staff','Welder','CNC Operator','Laser Operator'].includes(role)) return 'operator';
  if (role === 'Receptionist') return 'jobs';
  if (role === 'General Manager') return 'jobs';
  if (role === 'Operations Manager') return 'jobs';
  return 'dashboard';
}

function applyRoleUiConstraints() {
  const branchFilter = document.getElementById('branch-filter');
  const userBranchLabel = document.getElementById('user-branch-label');
  if (!branchFilter) return;

  if (can('allBranches')) {
    branchFilter.style.display = 'inline-flex';
    branchFilter.disabled = false;
    if (!S.branch) S.branch = 'all';
  } else {
    const roleBranch = S.user?.branch && S.user.branch !== 'all' ? S.user.branch : 'all';
    S.branch = roleBranch;
    branchFilter.value = roleBranch;
    branchFilter.style.display = 'none';
    branchFilter.disabled = true;
  }
  if (userBranchLabel) userBranchLabel.textContent = S.branch === 'all' ? 'All Branches' : S.branch;
}

function bindHashRouting() {
  if (S.hashBound) return;
  S.hashBound = true;
  window.addEventListener('hashchange', () => applyRouteFromHash());
}

function routePageFromHash() {
  const h = (window.location.hash || '').trim();
  if (!h || h === '#' || h === '#/' || h === '#/login') return null;
  return h.replace(/^#\//, '').split('?')[0] || null;
}

function setRoute(page) {
  const target = `#/${page}`;
  if (window.location.hash !== target) history.replaceState(null, '', window.location.pathname + window.location.search + target);
}

function applyRouteFromHash() {
  const page = routePageFromHash() || defaultPageForRole();
  nav(page, { fromRoute: true });
}

async function dbSave(type, method, data, id) {
  const paths = {jobs:'/jobs',clients:'/clients',staff:'/staff',saleslog:'/saleslog',quotes:'/quotes',leads:'/leads',inventory:'/inventory',opex:'/finance/opex',payroll:'/finance/payroll',pettycash:'/finance/pettycash',assets:'/finance/assets',procurement:'/finance/procurement'};
  const path = paths[type];
  if(!path) { toast('Saved locally','success'); return; }
  const endpoint = (method==='PUT' || method==='DELETE') ? `${path}/${id}` : path;
  let r;
  if(method==='POST') r = await API.post(path, data);
  else if(method==='PUT') r = await API.put(endpoint, data);
  else if(method==='DELETE') r = await API.del(endpoint);

  if (r) {
    toast('Saved successfully','success');
    return;
  }

  enqueueRetry({ method, path: endpoint, body: data || null, queuedAt: new Date().toISOString() });
  toast('Offline or API unavailable. Save queued for retry.','info');
}

function setApiStatus(online) {
  S.apiOnline = !!online;
  updateApiBadge();
}

function updateApiBadge() {
  const el = document.getElementById('api-status');
  if(!el) return;
  const pending = S.retryQueue.length;
  el.className = `api-pill ${S.apiOnline ? 'api-online' : 'api-offline'}`;
  el.textContent = S.apiOnline
    ? (pending ? `API Online • ${pending} queued` : 'API Online')
    : (pending ? `API Offline • ${pending} queued` : 'API Offline');
}

function persistRetryQueue() {
  localStorage.setItem('qp_retry_queue', JSON.stringify(S.retryQueue));
  updateApiBadge();
}

function enqueueRetry(item) {
  S.retryQueue.push(item);
  if (S.retryQueue.length > 200) {
    S.retryQueue = S.retryQueue.slice(-200);
  }
  persistRetryQueue();
}

async function checkApiHealth() {
  const h = await API.get('/health');
  if (h && h.ok) {
    setApiStatus(true);
    return true;
  }
  setApiStatus(false);
  return false;
}

async function flushRetryQueue() {
  if (S.retryFlushing || !S.retryQueue.length) return;
  if (!S.apiOnline) return;
  S.retryFlushing = true;
  try {
    while (S.retryQueue.length) {
      const job = S.retryQueue[0];
      const res = await API.req(job.method, job.path, job.body || undefined);
      if (!res) break;
      S.retryQueue.shift();
      persistRetryQueue();
    }
  } finally {
    S.retryFlushing = false;
    updateApiBadge();
  }
}

async function copyText(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch {}

  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', 'readonly');
    ta.style.position = 'absolute';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return !!ok;
  } catch {
    return false;
  }
}

function evalQtyFormula(formula, area, linear) {
  if(!formula) return 1;
  if(formula === 'area') return area;
  if(formula === 'linear') return linear;
  if(formula.startsWith('fixed:')) return parseFloat(formula.split(':')[1]) || 0;
  if(formula.includes('area*')) return area * (parseFloat(formula.replace('area*','')) || 1);
  if(formula.includes('linear*')) return linear * (parseFloat(formula.replace('linear*','')) || 1);
  return parseFloat(formula) || 1;
}

function stockAvailableFor(materialName) {
  const row = (S.inventory||[]).find(i => {
    const n = (i.name || '').toLowerCase();
    const m = materialName.toLowerCase();
    return n.includes(m) || m.includes(n);
  });
  if(!row) return 0;
  if(typeof row.qty === 'number') return row.qty;
  if(typeof row.remainingMeters === 'number') return row.remainingMeters;
  if(typeof row.qtyBottles === 'number') return row.qtyBottles;
  return 0;
}

function calcMaterialUsage(serviceName, widthCm, heightCm) {
  const mats = SERVICE_MATERIALS[serviceName] || [];
  const widthM = Math.max(0, Number(widthCm||0))/100;
  const heightM = Math.max(0, Number(heightCm||0))/100;
  const area = Math.max(1, widthM * heightM);
  const linear = Math.max(widthM, heightM, 1);
  return mats.map(m => {
    const base = evalQtyFormula(m.qty, area, linear);
    const required = Math.round((base * (1 + (m.wastage||0))) * 100) / 100;
    const available = stockAvailableFor(m.name);
    return {
      name: m.name,
      unit: m.unit,
      base: Math.round(base * 100) / 100,
      required,
      available,
      shortage: Math.max(0, Math.round((required - available) * 100) / 100)
    };
  });
}

function renderMaterialPreview() {
  const serviceEl = document.getElementById('nj-service');
  const widthEl = document.getElementById('nj-width');
  const heightEl = document.getElementById('nj-height');
  const out = document.getElementById('nj-material-preview');
  if(!serviceEl || !out) return;
  const service = serviceEl.value;
  if(!service) {
    out.innerHTML = '<div style="font-size:12px;color:var(--text3)">Select service and size to preview material plan.</div>';
    return;
  }
  const plan = calcMaterialUsage(service, widthEl?.value, heightEl?.value);
  if(!plan.length) {
    out.innerHTML = '<div style="font-size:12px;color:var(--text3)">No material mapping yet for this service.</div>';
    return;
  }
  out.innerHTML = `<table style="width:100%"><thead><tr><th>Material</th><th>Req.</th><th>Available</th><th>Status</th></tr></thead><tbody>${plan.map(p=>`<tr><td style="font-size:12px">${p.name}</td><td style="font-size:12px;font-family:var(--mono)">${p.required} ${p.unit}</td><td style="font-size:12px;font-family:var(--mono)">${p.available}</td><td>${p.shortage>0?'<span class="badge badge-red">Short '+p.shortage+'</span>':'<span class="badge badge-green">OK</span>'}</td></tr>`).join('')}</tbody></table>`;
}

function updateServiceOptionsByCategory() {
  const catEl = document.getElementById('nj-cat');
  const serviceEl = document.getElementById('nj-service');
  if(!catEl || !serviceEl) return;
  const list = SERVICE_CATALOG[catEl.value] || [];
  serviceEl.innerHTML = `<option value="">Select service</option>${list.map(s=>`<option value="${s}">${s}</option>`).join('')}`;
  renderMaterialPreview();
}

async function registerPWA() {
  if(!('serviceWorker' in navigator)) return;
  try {
    await navigator.serviceWorker.register('sw.js');
  } catch(e) {
    console.warn('Service worker registration failed:', e?.message || e);
  }
}

function updateJobStage(id, stage) {
  const j = S.jobs.find(x=>x.id===id);
  if(!j) return;
  if (!canEditAnyJob() && !canDesignerAdvance(stage) && !canOperatorAdvance(stage)) {
    toast('You are not allowed to move this job to that stage', 'error');
    return;
  }
  if(stage==='printing' && !j.paid && !confirm('Job is not paid. Manager override to proceed?')) return;
  if(stage==='printing' && !j.client_approved_by && !confirm('No client approval recorded. Proceed anyway?')) return;
  j.stage = stage;
  j.history = j.history||[];
  j.history.push({action:`Stage changed to ${stage}`, by:S.user.name, at:new Date().toISOString()});
  auditLog(`Job ${id} stage changed to ${stage}`);
  dbSave('jobs','PUT',j,id);
  toast(`Job moved to ${stage}`,'success');
  closeModal(); render();
}

function markPaid(id) {
  const j = S.jobs.find(x=>x.id===id);
  if(!j) return;
  if (!canManagePayments()) {
    toast('You are not allowed to record payments', 'error');
    return;
  }
  j.paid = true;
  if (j.stage === 'installed') j.stage = 'paid';
  dbSave('jobs','PUT',j,id);
  auditLog('Payment recorded for job '+id);
  toast('Job marked as paid','success');
  closeModal(); render();
}

  document.getElementById('q-vat').textContent='KSh '+Math.round(vat).toLocaleString();

}

function renderCommissions() {
  const salesStaff = S.staff.filter(s=>['Sales','Receptionist','General Manager','Admin'].includes(s.role));

    d.setMonth(d.getMonth()-i);

  });
  const month = document.getElementById('comm-month')?.value || monthOptions[0];
  const monthSales = (S.salesLog||[]).filter(sl=>(sl.date||'').startsWith(month)).reduce((a,b)=>a+(b.amount||0),0);
  const byStaff = salesStaff.map(s=>{
    const myJobs = (S.salesLog||[]).filter(sl=>sl.logged_by===s.name && (sl.date||'').startsWith(month));
    const total = myJobs.reduce((a,b)=>a+(b.amount||0),0);
    const rate = (s.commission_rate||5)/100;
    const commission = Math.round(total*rate);

  <thead><tr><th>Staff</th><th>Role</th><th>Branch</th><th>Jobs Logged</th><th>Total Sales</th><th>Rate</th><th>Commission</th></tr></thead>

  <thead><tr><th>Staff</th><th>Target</th><th>Actual</th><th>Progress</th><th>Gap</th></tr></thead>
  <tbody>${byStaff.map(r=>`<tr><td>${r.staff.name}</td><td style="font-family:var(--mono)">${ksh(r.target)}</td><td style="font-family:var(--mono)">${ksh(r.total)}</td><td><div style="background:var(--bg4);border-radius:4px;height:18px;overflow:hidden;min-width:140px;"><div style="height:100%;width:${Math.max(3,r.progress)}%;background:${r.progress>=100?'var(--green)':r.progress>=70?'var(--accent)':'var(--red)'};font-size:10px;color:#fff;padding:2px 6px;">${r.progress}%</div></div></td><td style="font-family:var(--mono);color:${r.total>=r.target?'var(--green)':'var(--red)'}">${r.total>=r.target?'Reached':ksh(r.target-r.total)}</td></tr>`).join('')||'<tr><td colspan="5"><div class="empty-state"><p>No target data</p></div></td></tr>'}</tbody>

function setFabSubstage(id, substage) {
  const j = S.jobs.find(x=>x.id===id);
  if(!j) return;
  if (!isRole('Admin','General Manager','Operations Manager','Operator','Fabrication Staff','Welder','CNC Operator','Laser Operator')) {
    toast('You are not allowed to update fabrication sub-stages', 'error');
    return;
  }
  const flow = ['queued','in_progress','quality_check','complete'];
  const prev = j.fab_substage || 'queued';
  const nextIndex = flow.indexOf(substage);
  const prevIndex = flow.indexOf(prev);
  if (nextIndex > prevIndex + 1) {
    toast('Complete fabrication steps in sequence', 'error');
    return;
  }
  j.fab_substage = substage;
  j.history = j.history || [];
  j.history.push({action:`Fabrication sub-stage: ${substage.replace('_',' ')}`, by:S.user?.name||'System', at:new Date().toISOString()});
  if(substage === 'complete') {
    j.stage = 'ready';
  }
  auditLog(`Job ${id} fabrication updated to ${substage}`);
  dbSave('jobs','PUT',j,id);
  toast(`Updated ${id} to ${substage.replace('_',' ')}`, 'success');
  render();
}

function advanceJob(id, stage) {
  const j=S.jobs.find(x=>x.id===id);
  if(!j) return;
  if (!canEditAnyJob() && !canDesignerAdvance(stage) && !canOperatorAdvance(stage)) {
    toast('You are not allowed to advance this job', 'error');
    return;
  }
  j.stage=stage;
  auditLog(`Job ${id} advanced to ${stage}`);
  dbSave('jobs','PUT',j,id);
  toast(`Job ${id} moved to ${stage}`,'success');
  render();
}

function renderPayroll() {

}
function showPayrollForm(month) {
  const staffOpts = S.staff.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
  openModal('New Payroll Entry',`<div class="form-row cols-2"><div class="fld"><label>Staff</label><select id="pe-staff">${staffOpts}</select></div><div class="fld"><label>Month</label><input type="month" id="pe-month" value="${month}"></div></div><div class="form-row cols-2"><div class="fld"><label>Gross Salary</label><input type="number" id="pe-gross"></div><div class="fld"><label>NHIF</label><input type="number" id="pe-nhif" value="1700"></div></div><div class="form-row cols-2"><div class="fld"><label>NSSF</label><input type="number" id="pe-nssf" value="600"></div><div class="fld"><label>PAYE</label><input type="number" id="pe-paye" placeholder="Auto: 12% of gross"></div></div>`,`<button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="savePayrollEntry('${month}')">Save</button>`);
}
function savePayrollEntry(month) {
  const staffId = +document.getElementById('pe-staff').value;
  const staff = S.staff.find(s=>s.id===staffId);
  if(!staff) { toast('Select staff','error'); return; }
  const gross = +document.getElementById('pe-gross').value || staff.salary;
  const nhif = +document.getElementById('pe-nhif').value;
  const nssf = +document.getElementById('pe-nssf').value;
  const paye = +document.getElementById('pe-paye').value || Math.round(gross*0.12);
  const existing = S.payroll.find(p=>p.staff_id===staffId && p.month===month);
  if(existing) {
    existing.gross_salary=gross; existing.nhif=nhif; existing.nssf=nssf; existing.paye=paye; existing.net_pay=gross-nhif-nssf-paye;
    dbSave('payroll','PUT',existing);
  } else {
    const p={id:S.payroll.length+1,month,staff_id:staffId,staff_name:staff.name,gross_salary:gross,nhif,nssf,paye,net_pay:gross-nhif-nssf-paye,status:'pending'};
    S.payroll.push(p);
    dbSave('payroll','POST',p);
  }
  auditLog('Payroll: '+staff.name);
  toast('Entry saved','success');
  closeModal();
  render();
}
function editPayrollEntry(id) {
  const p = S.payroll.find(x=>x.id===id);
  if(!p || p.status==='paid') { toast('Cannot edit processed','error'); return; }
  openModal('Edit — '+p.staff_name,`<div class="form-row cols-2"><div class="fld"><label>Gross</label><input type="number" id="ep-gross" value="${p.gross_salary}"></div><div class="fld"><label>NHIF</label><input type="number" id="ep-nhif" value="${p.nhif||1700}"></div></div><div class="form-row cols-2"><div class="fld"><label>NSSF</label><input type="number" id="ep-nssf" value="${p.nssf||600}"></div><div class="fld"><label>PAYE</label><input type="number" id="ep-paye" value="${p.paye||0}"></div></div>`,`<button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="updatePayrollEntry(${p.id})">Update</button>`);
}
function updatePayrollEntry(id) {
  const p = S.payroll.find(x=>x.id===id);
  if(!p) return;
  p.gross_salary = +document.getElementById('ep-gross').value;
  p.nhif = +document.getElementById('ep-nhif').value;
  p.nssf = +document.getElementById('ep-nssf').value;
  p.paye = +document.getElementById('ep-paye').value;
  p.net_pay = p.gross_salary - p.nhif - p.nssf - p.paye;
  dbSave('payroll','PUT',p);
  auditLog('Payroll updated: '+p.staff_name);
  toast('Updated','success');
  closeModal();
  render();
}
function processPayroll(month) {
  const payroll = S.payroll.filter(p=>p.month===month);
  if(payroll.length===0) { toast('No entries','error'); return; }
  if(!confirm('Process payroll for '+payroll.length+' staff?')) return;
  payroll.forEach(p=>{ p.status='paid'; dbSave('payroll','PUT',p); });
  auditLog('Payroll processed: '+month+' ('+payroll.length+' staff)');
  toast('Payroll processed','success');
  render();
}

async function saveStaff() {
  const name = document.getElementById('nst-name').value.trim();
  const email = document.getElementById('nst-email').value.trim().toLowerCase();
  const role = document.getElementById('nst-role').value;
  const branch = document.getElementById('nst-branch').value;
  const salary = +document.getElementById('nst-salary').value;
  let pass = document.getElementById('nst-pass').value;

  if (!name || !email) {
    toast('Name and email are required','error');
    return;
  }

  let generated = false;
  if (!pass) {
    generated = true;
    pass = 'QP@' + Math.random().toString(36).slice(-8) + '1!';
  }
  if (pass.length < 8) {
    toast('Password must be at least 8 characters','error');
    return;
  }

  const s = {
    id: S.staff.length + 1,
    name,
    email,
    role,
    branch,
    salary,
    color: '#' + Math.floor(Math.random() * 16777215).toString(16),
    active: true
  };

  S.staff.push(s);
  auditLog('Staff added: ' + s.name + ' (' + s.role + ')');
  await dbSave('staff', 'POST', s);

  const account = await API.post(`/staff/${encodeURIComponent(s.id)}/account`, {
    email: s.email,
    password: pass,
    name: s.name,
    role: s.role,
    branch: s.branch
  });

  if (account && account.ok) {
    if (generated) {
      closeModal();
      render();
      toast('Staff added and login account created', 'success');
      showStaffPasswordModal(s.email, pass);
      return;
    } else {
      toast('Staff added and login account created', 'success');
    }
  } else {
    toast('Staff profile saved, but login account creation failed. Check API connection.', 'info');
  }

  closeModal();
  render();
}

}

function saveAttendanceEntry() {
  const staffId = +document.getElementById('at-staff').value;
  const staff = S.staff.find(s=>s.id===staffId);
  const date = document.getElementById('at-date').value;
  const checkIn = document.getElementById('at-in').value;
  const checkOut = document.getElementById('at-out').value;
  if(!staff || !date) { toast('Staff and date are required','error'); return; }
  let hours = 0;
  if(checkIn && checkOut) {
    const start = new Date(`1970-01-01T${checkIn}:00`);
    const end = new Date(`1970-01-01T${checkOut}:00`);
    hours = Math.max(0, (end-start)/3600000);
  }
  const status = !checkIn ? 'Absent' : (checkIn > '08:15' ? 'Late' : 'Present');
  const existing = (S.attendanceRecords||[]).find(a=>a.staff_id===staffId && a.date===date);
  if(existing) {
    existing.check_in = checkIn || existing.check_in;
    existing.check_out = checkOut || existing.check_out;
    existing.hours = hours;
    existing.status = status;
    existing.source = document.getElementById('at-source').value;
    dbSave('attendance','PUT',existing);
  } else {
    const row = {id:(S.attendanceRecords?.length||0)+1, staff_id:staff.id, staff_name:staff.name, date, check_in:checkIn, check_out:checkOut, hours, status, source:document.getElementById('at-source').value};
    if(!S.attendanceRecords) S.attendanceRecords = [];
    S.attendanceRecords.unshift(row);
    dbSave('attendance','POST',row);
  }
  auditLog('Attendance saved: '+staff.name+' '+date);
  toast('Attendance saved','success');
  closeModal();
  render();
}

function approveLeaveRequest(id) {

  lr.status = 'approved';

function rejectLeaveRequest(id) {

  lr.status = 'rejected';

  lr.rejected_date = new Date().toISOString().split('T')[0];

function exportCSV() {
  const jobs = filteredJobs();
  const header = ['Job ID','Title','Client','Branch','Stage','Amount','Paid','Priority','Deadline'];
  const rows = jobs.map(j=>[j.id,j.title,clientName(j.client_id),j.branch,j.stage,j.amount,j.paid?'Yes':'No',j.priority,j.deadline||'']);
  const csv = [header,...rows].map(r=>r.map(v=>`"${v}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = `jobs_${new Date().toISOString().split('T')[0]}.csv`;
  a.click();
  toast('CSV exported','success');
}

function doPrintInvoice(jid,type){
  const j=S.jobs.find(x=>x.id===jid); if(!j) return;
  const isQuote=type==='quotation';
  const docNum=document.getElementById('inv-num').value;
  const cname=document.getElementById('inv-cname').value;
  const vatRate=parseFloat(document.getElementById('inv-vat')?.value)||0;
  const paid=isQuote?0:(parseFloat(document.getElementById('inv-paid')?.value)||0);
  const terms=document.getElementById('inv-terms')?.value||'';
  const rawLines=document.getElementById('inv-items').value.split('\n').filter(x=>x.trim());
  const items=rawLines.map(line=>{const p=line.split('|').map(x=>x.trim());return{desc:p[0]||line,qty:p[1]||'1',amount:parseFloat((p[2]||'0').replace(/,/g,''))||0};});
  const subtotal=items.reduce((s,i)=>s+i.amount,0);
  const vat=Math.round(subtotal*vatRate);
  const total=subtotal+vat;
  const balance=total-paid;
  const itemRows=items.map(i=>`<tr style="border-bottom:1px solid #e8ecf0">
    <td style="padding:9px 12px;font-size:13px">${i.desc}</td>

function showJobCosting(jid){
  const j=S.jobs.find(x=>x.id===jid); if(!j) return;
  const matItem=S.inventory.find(i=>i.name.toLowerCase().includes((j.material||'').toLowerCase()));
  const matCost=matItem?(matItem.unit_cost||0)*(j.material_qty||1):0;
  const des=j.designer_id?S.staff.find(u=>u.id===j.designer_id):null;
  const dailyRate=des?Math.round((des.salary||0)/22):0;
  const estDays=j.deadline?Math.max(1,Math.round((new Date(j.deadline)-new Date())/(864e5))):2;
  const labourCost=dailyRate*Math.min(estDays,5);
  const totalCost=matCost+labourCost;
  const gp=(j.amount||0)-totalCost;
  const margin=j.amount>0?Math.round(gp/j.amount*100):0;
  const mc=margin>=30?'var(--green)':margin>=15?'var(--yellow)':'var(--red)';
  openModal(`Job Costing — ${j.id}`,`
    <div style="background:var(--bg3);border-radius:var(--radius);padding:10px 14px;margin-bottom:14px;font-size:13px"><strong>${j.title}</strong> · ${clientName(j.client_id)}</div>
    <div class="grid-2" style="margin-bottom:14px">
      <div class="card">
        <div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:10px;text-transform:uppercase">Estimated Costs</div>
        <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px"><span style="color:var(--text2)">Materials</span><span style="font-family:var(--mono)">${ksh(matCost)}</span></div>
        <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px"><span style="color:var(--text2)">Labour (est. ${Math.min(estDays,5)} days)</span><span style="font-family:var(--mono)">${ksh(labourCost)}</span></div>
        <div style="display:flex;justify-content:space-between;padding:8px 0;font-size:13px;font-weight:700"><span>Total</span><span style="font-family:var(--mono)">${ksh(totalCost)}</span></div>
      </div>
      <div class="card">
        <div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:10px;text-transform:uppercase">Revenue & Margin</div>
        <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px"><span style="color:var(--text2)">Job Amount</span><span style="font-family:var(--mono)">${ksh(j.amount)}</span></div>
        <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px"><span style="color:var(--text2)">Gross Profit</span><span style="font-family:var(--mono);color:${gp>0?'var(--green)':'var(--red)'}">${ksh(gp)}</span></div>
        <div style="display:flex;justify-content:space-between;padding:8px 0;font-size:13px;font-weight:700"><span>Margin</span><span style="font-size:22px;color:${mc}">${margin}%</span></div>
      </div>
    </div>
    <div style="background:${margin>=30?'var(--green-dim)':margin>=15?'var(--yellow-dim)':'var(--red-dim)'};border-radius:var(--radius);padding:10px 14px;font-size:12px;color:${mc}">
      ${margin>=30?'✅ Good margin':''}${margin>=15&&margin<30?'⚠ Low margin — review pricing':''}${margin<15?'❌ Very low — may be underpriced':''}
    </div>
  `,`<button class="btn btn-secondary" onclick="closeModal()">Close</button>`);
}

function renderCashRecon(){

  const methods=['Mpesa','Cash','Bank','Credit'];
  const byM={};methods.forEach(m=>{byM[m]=sales.filter(s=>s.pay_method===m).reduce((t,s)=>t+s.amount,0);});

  return `

    </div>`).join('')}

    <div><div style="font-size:12px;opacity:.8">TOTAL COLLECTED TODAY</div><div style="font-size:24px;font-weight:700;font-family:var(--mono)">${ksh(total)}</div></div>

    </tr>`).join('')}</tbody>
  </table></div>`:'<div class="empty-state"><div class="empty-icon">💰</div><p>No sales logged today yet</p></div>'}
</div>`;
}

const ACCOUNTS={'Cash & Bank':{type:'asset',code:'1001'},'Accounts Receivable':{type:'asset',code:'1002'},'Inventory':{type:'asset',code:'1003'},'Equipment':{type:'asset',code:'1004'},'Accounts Payable':{type:'liability',code:'2001'},'Sales Tax Payable':{type:'liability',code:'2002'},'Capital':{type:'equity',code:'3001'},'Sales Revenue':{type:'revenue',code:'4001'},'Service Revenue':{type:'revenue',code:'4002'},'Rent Expense':{type:'expense',code:'5001'},'Salaries Expense':{type:'expense',code:'5002'},'Utilities Expense':{type:'expense',code:'5003'},'Supplies Expense':{type:'expense',code:'5004'},'Printing Supplies':{type:'expense',code:'5005'}};
function getLedgerBalance(acc){return(S.ledger||[]).reduce((s,je)=>{je.entries.forEach(e=>{if(e.account===acc){s+=e.type==='debit'?e.amount:-e.amount;}});return s;},0);}
function renderLedger(){
  const tRev=Object.keys(ACCOUNTS).filter(a=>ACCOUNTS[a].type==='revenue').reduce((s,a)=>s+getLedgerBalance(a),0);
  const tExp=Object.keys(ACCOUNTS).filter(a=>ACCOUNTS[a].type==='expense').reduce((s,a)=>s+getLedgerBalance(a),0);
  const netP=tRev-tExp;
  const tAssets=Object.keys(ACCOUNTS).filter(a=>ACCOUNTS[a].type==='asset').reduce((s,a)=>s+getLedgerBalance(a),0);
  const tLiab=Object.keys(ACCOUNTS).filter(a=>ACCOUNTS[a].type==='liability').reduce((s,a)=>s+getLedgerBalance(a),0);
  return `
<div class="page-header"><div class="page-title">Accounting Ledger</div><button class="btn btn-primary" onclick="showAddJournal()">+ Journal Entry</button></div>
<div class="grid-4" style="margin-bottom:20px">
  <div class="stat-card"><div class="stat-label">Total Revenue</div><div class="stat-value green">${ksh(tRev)}</div></div>
  <div class="stat-card"><div class="stat-label">Total Expenses</div><div class="stat-value red">${ksh(tExp)}</div></div>
  <div class="stat-card"><div class="stat-label">Net ${netP>=0?'Profit':'Loss'}</div><div class="stat-value" style="color:${netP>=0?'var(--green)':'var(--red)'}">${ksh(Math.abs(netP))}</div></div>
  <div class="stat-card"><div class="stat-label">Total Assets</div><div class="stat-value blue">${ksh(tAssets)}</div></div>
</div>
<div class="grid-2" style="margin-bottom:16px">
  <div class="card">
    <div class="card-header"><div class="card-title">📊 Profit & Loss</div></div>
    <div style="font-size:11px;font-weight:600;color:var(--text3);margin-bottom:6px;text-transform:uppercase">Revenue</div>
    ${Object.keys(ACCOUNTS).filter(a=>ACCOUNTS[a].type==='revenue').map(a=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:13px"><span style="color:var(--text2)">${a}</span><span style="font-family:var(--mono);color:var(--green)">${ksh(getLedgerBalance(a))}</span></div>`).join('')}
    <div style="display:flex;justify-content:space-between;padding:7px 0;font-size:13px;font-weight:700;border-top:2px solid var(--border);margin-top:4px"><span>Total Revenue</span><span style="font-family:var(--mono);color:var(--green)">${ksh(tRev)}</span></div>
    <div style="height:10px"></div>
    <div style="font-size:11px;font-weight:600;color:var(--text3);margin-bottom:6px;text-transform:uppercase">Expenses</div>
    ${Object.keys(ACCOUNTS).filter(a=>ACCOUNTS[a].type==='expense').map(a=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:13px"><span style="color:var(--text2)">${a}</span><span style="font-family:var(--mono);color:var(--red)">${ksh(getLedgerBalance(a))}</span></div>`).join('')}
    <div style="display:flex;justify-content:space-between;padding:10px 0;font-size:15px;font-weight:800;border-top:3px solid var(--accent);margin-top:4px"><span>NET ${netP>=0?'PROFIT':'LOSS'}</span><span style="font-family:var(--mono);color:${netP>=0?'var(--green)':'var(--red)'}">${ksh(Math.abs(netP))}</span></div>
  </div>
  <div class="card">
    <div class="card-header"><div class="card-title">🏦 Balance Sheet</div></div>
    <div style="font-size:11px;font-weight:600;color:var(--blue);margin-bottom:6px;text-transform:uppercase">Assets</div>
    ${Object.keys(ACCOUNTS).filter(a=>ACCOUNTS[a].type==='asset').map(a=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:13px"><span style="color:var(--text2)">${a}</span><span style="font-family:var(--mono)">${ksh(getLedgerBalance(a))}</span></div>`).join('')}
    <div style="display:flex;justify-content:space-between;padding:7px 0;font-size:13px;font-weight:700;border-top:2px solid var(--border);margin-top:4px"><span>Total Assets</span><span style="font-family:var(--mono);color:var(--blue)">${ksh(tAssets)}</span></div>
    <div style="height:8px"></div>
    <div style="font-size:11px;font-weight:600;color:var(--red);margin-bottom:6px;text-transform:uppercase">Liabilities</div>
    ${Object.keys(ACCOUNTS).filter(a=>ACCOUNTS[a].type==='liability').map(a=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:13px"><span style="color:var(--text2)">${a}</span><span style="font-family:var(--mono)">${ksh(getLedgerBalance(a))}</span></div>`).join('')}

  </div>
</div>
<div class="card">
  <div class="card-header"><div class="card-title">Journal Entries</div></div>

    <thead><tr><th>Entry #</th><th>Date</th><th>Ref</th><th>Description</th><th>Account</th><th>Debit</th><th>Credit</th><th>By</th></tr></thead>
    <tbody>${(S.ledger||[]).map(je=>je.entries.map((e,i)=>`<tr ${i>0?'style="background:var(--bg3)"':''}>
      ${i===0?`<td rowspan="${je.entries.length}" style="font-size:11px;color:var(--accent);font-weight:700;vertical-align:top">${je.id}</td>

               <td rowspan="${je.entries.length}" style="font-size:11px;vertical-align:top">${je.ref}</td>
               <td rowspan="${je.entries.length}" style="font-size:12px;vertical-align:top">${je.description}</td>`:''}
      <td style="font-size:12px">${e.account}</td>
      <td style="font-family:var(--mono);font-size:12px;color:var(--green)">${e.type==='debit'?ksh(e.amount):'—'}</td>
      <td style="font-family:var(--mono);font-size:12px;color:var(--red)">${e.type==='credit'?ksh(e.amount):'—'}</td>
      ${i===0?`<td rowspan="${je.entries.length}" style="font-size:11px;color:var(--text2);vertical-align:top">${je.postedBy}</td>`:''}
    </tr>`).join('')).join('')}</tbody>
  </table></div>`:'<div class="empty-state"><div class="empty-icon">📒</div><p>No journal entries yet</p></div>'}
</div>`;
}
