  `,`<button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveJournalEntry()">Post Entry</button>`);
}
function saveJournalEntry(){
  const date=document.getElementById('je-date').value,ref=document.getElementById('je-ref').value.trim(),desc=document.getElementById('je-desc').value.trim();
  const drAcc=document.getElementById('je-dr-acc').value,drAmt=+document.getElementById('je-dr-amt').value;
  const crAcc=document.getElementById('je-cr-acc').value,crAmt=+document.getElementById('je-cr-amt').value;
  if(!desc||!drAmt||!crAmt){toast('Fill in all fields','error');return;}
  if(drAmt!==crAmt){toast(`Debit (${ksh(drAmt)}) must equal Credit (${ksh(crAmt)})`,'error');return;}
  if(!S.ledger) S.ledger=[];
  S.ledger.unshift({id:'JE-'+String(S.ledger.length+1).padStart(4,'0'),date,ref,description:desc,postedBy:S.user.name,entries:[{account:drAcc,type:'debit',amount:drAmt},{account:crAcc,type:'credit',amount:crAmt}]});
  closeModal();toast('Journal entry posted','success');render();
}
// ============================================================
// BANK RECONCILIATION
// ============================================================
function renderReconciliation(){
  if(!S.bankStatements) S.bankStatements=[];
  const stmts=S.bankStatements;
  const matched=stmts.filter(s=>s.matched),unmatched=stmts.filter(s=>!s.matched);
  const tCr=stmts.filter(s=>s.type==='credit').reduce((s,x)=>s+x.amount,0);
  const tDb=stmts.filter(s=>s.type==='debit').reduce((s,x)=>s+x.amount,0);
  const sysR=S.jobs.filter(j=>j.paid).reduce((s,j)=>s+(j.amount||0),0);
  return `
<div class="page-header"><div class="page-title">Bank Reconciliation</div><button class="btn btn-secondary" onclick="showImportStatement()">+ Add Entry</button></div>
<div class="grid-4" style="margin-bottom:20px">
  <div class="stat-card"><div class="stat-label">Bank Credits</div><div class="stat-value green">${ksh(tCr)}</div></div>
  <div class="stat-card"><div class="stat-label">Bank Debits</div><div class="stat-value red">${ksh(tDb)}</div></div>
  <div class="stat-card"><div class="stat-label">Matched</div><div class="stat-value" style="color:var(--green)">${matched.length}</div></div>
  <div class="stat-card"><div class="stat-label">Unmatched</div><div class="stat-value" style="color:${unmatched.length?'var(--red)':'var(--green)'}">${unmatched.length}</div></div>
</div>
${unmatched.length?`<div class="alert alert-warn">⚠ ${unmatched.length} unmatched transaction${unmatched.length>1?'s':''} need attention</div>`:''}
<div class="grid-2" style="margin-bottom:16px">
  <div class="card">
    <div class="card-header"><div class="card-title">Summary</div></div>
    <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px"><span style="color:var(--text2)">Bank Balance</span><span style="font-family:var(--mono)">${ksh(tCr-tDb)}</span></div>
    <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px"><span style="color:var(--text2)">System Receipts</span><span style="font-family:var(--mono)">${ksh(sysR)}</span></div>
    <div style="display:flex;justify-content:space-between;padding:10px 0;font-size:14px;font-weight:700;border-top:2px solid var(--accent);margin-top:4px"><span>Variance</span><span style="font-family:var(--mono);color:${Math.abs(tCr-sysR)<1000?'var(--green)':'var(--red)'}">${ksh(Math.abs(tCr-sysR))}</span></div>
  </div>
  <div class="card">
    <div class="card-header"><div class="card-title">Unmatched Items</div></div>
    ${unmatched.length===0?'<div class="empty-state"><p>All transactions matched ✓</p></div>':
      unmatched.map(s=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px"><div><div style="font-weight:600">${s.description}</div><div style="color:var(--text3)">${s.date}</div></div><span style="font-family:var(--mono);color:${s.type==='credit'?'var(--green)':'var(--red)'};font-weight:700">${ksh(s.amount)}</span></div>`).join('')}
  </div>
</div>
<div class="card">
  <div class="card-header"><div class="card-title">Statement Entries</div></div>
  ${stmts.length?`<div class="tbl-wrap"><table>
    <thead><tr><th>Date</th><th>Description</th><th>Type</th><th>Amount</th><th>Bank</th><th>Status</th><th>Matched To</th><th></th></tr></thead>
    <tbody>${stmts.map(s=>`<tr>
      <td style="font-size:12px">${dateFmt(s.date)}</td>
      <td style="font-size:12px;font-weight:500">${s.description}</td>
      <td>${s.type==='credit'?'<span class="badge badge-green">Credit In</span>':'<span class="badge badge-red">Debit Out</span>'}</td>
      <td style="font-family:var(--mono);font-weight:700;color:${s.type==='credit'?'var(--green)':'var(--red)'}">${ksh(s.amount)}</td>
      <td style="font-size:12px">${s.bank}</td>
      <td>${s.matched?'<span class="badge badge-green">✓ Matched</span>':'<span class="badge badge-yellow">Unmatched</span>'}</td>
      <td style="font-size:12px;color:var(--accent)">${s.matchedRef||'—'}</td>
      <td>${!s.matched?`<button class="btn btn-primary btn-sm" onclick="showMatchStatement('${s.id}')">Match</button>`:'<span style="color:var(--green)">✓</span>'}</td>
    </tr>`).join('')}</tbody>
  </table></div>`:'<div class="empty-state"><div class="empty-icon">🏦</div><p>Add bank statement entries to begin</p></div>'}
</div>`;
}
function showImportStatement(){
  openModal('Add Bank Statement Entry',`
    <div class="form-row cols-2"><div class="fld"><label>Date</label><input type="date" id="bs-date" value="${new Date().toISOString().split('T')[0]}"></div><div class="fld"><label>Bank</label><input id="bs-bank" value="Equity Bank"></div></div>
    <div class="form-row"><div class="fld"><label>Description</label><input id="bs-desc" placeholder="From bank statement"></div></div>
    <div class="form-row cols-2"><div class="fld"><label>Type</label><select id="bs-type"><option value="credit">Credit (Money In)</option><option value="debit">Debit (Money Out)</option></select></div><div class="fld"><label>Amount (KSh)</label><input type="number" id="bs-amt" placeholder="0"></div></div>
  `,`<button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveStatementEntry()">Add</button>`);
}
function saveStatementEntry(){
  const amt=+document.getElementById('bs-amt').value,desc=document.getElementById('bs-desc').value.trim();
  if(!amt||!desc){toast('Enter description and amount','error');return;}
  if(!S.bankStatements) S.bankStatements=[];
  S.bankStatements.unshift({id:'BS-'+String(S.bankStatements.length+1).padStart(3,'0'),date:document.getElementById('bs-date').value,description:desc,amount:amt,type:document.getElementById('bs-type').value,bank:document.getElementById('bs-bank').value,matched:false,matchedRef:null});
  closeModal();toast('Entry added','success');render();
}
function showMatchStatement(sid){
  const s=S.bankStatements.find(x=>x.id===sid); if(!s) return;
  const sug=S.jobs.filter(j=>Math.abs((j.paid?j.amount:0)-s.amount)<5000||Math.abs(j.amount-s.amount)<5000);
  openModal('Match Transaction',`
    <div class="card" style="margin-bottom:14px"><div style="font-size:13px;font-weight:600">${s.description}</div><div style="font-size:12px;color:var(--text2);margin-top:4px">${dateFmt(s.date)} · <span style="color:${s.type==='credit'?'var(--green)':'var(--red)'};font-weight:700">${ksh(s.amount)}</span></div></div>
    ${sug.length?sug.map(j=>`<div onclick="doMatchStatement('${sid}','${j.id}')" style="display:flex;justify-content:space-between;align-items:center;padding:10px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:6px;cursor:pointer">
      <div><div style="font-weight:600;font-size:13px">${j.id} — ${j.title.substring(0,30)}</div><div style="font-size:11px;color:var(--text2)">${clientName(j.client_id)}</div></div>
      <button class="btn btn-success btn-sm">Match</button>
    </div>`).join(''):'<div class="alert alert-info" style="margin-bottom:12px">No close matches found. Enter manually.</div>'}
    <div class="form-row" style="margin-top:10px"><div class="fld"><label>Or enter reference manually</label>
      <div style="display:flex;gap:8px"><input id="match-ref" placeholder="e.g. QP-10001" style="flex:1"><button class="btn btn-primary" onclick="doMatchStatement('${sid}',document.getElementById('match-ref').value)">Match</button><button class="btn btn-secondary" onclick="doMatchStatement('${sid}','BANK-CHARGE')">Bank Charge</button></div>
    </div></div>
  `,`<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>`);
}
function doMatchStatement(sid,ref){
  const s=S.bankStatements.find(x=>x.id===sid);
  if(s){s.matched=true;s.matchedRef=ref;}
  closeModal();toast('Matched','success');render();
}
// ============================================================
// AUDIT LOG
// ============================================================
function renderAuditLog(){
  if(!S.auditLog) S.auditLog=[];
  return `
<div class="page-header"><div class="page-title">Audit Log</div><button class="btn btn-secondary btn-sm" onclick="refreshAuditLog()">Refresh Log</button></div>
<div class="card">
  ${S.auditLog.length?`<div class="tbl-wrap"><table>
    <thead><tr><th>Timestamp</th><th>User</th><th>Role</th><th>Branch</th><th>Action</th></tr></thead>
    <tbody>${S.auditLog.map(e=>`<tr>
      <td style="font-size:11px;font-family:var(--mono)">${e.ts}</td>
      <td style="font-weight:500">${e.user}</td>
      <td><span class="badge badge-blue" style="font-size:10px">${e.role}</span></td>
      <td style="font-size:12px">${e.branch}</td>
      <td style="font-size:12px">${e.action}</td>
    </tr>`).join('')}</tbody>
  </table></div>`:'<div class="empty-state"><div class="empty-icon">🔍</div><p>Actions will be logged here</p></div>'}
</div>`;
}

function refreshAuditLog() {
  render();
  toast('Audit log refreshed', 'success');
}
function auditLog(action){
  if(!S.auditLog) S.auditLog=[];
  S.auditLog.unshift({ts:new Date().toLocaleString('en-KE'),user:S.user?.name||'System',role:S.user?.role||'System',branch:S.user?.branch||'all',action});
}
// ============================================================
// CLIENT PORTAL
// ============================================================
function renderPortal(){
  return `
<div class="page-header"><div class="page-title">Client Portal Preview</div></div>
<div class="card" style="margin-bottom:16px">
  <p style="font-size:13px;color:var(--text2);margin-bottom:14px">Generate a shareable tracking page for any client. They can view job status and balances without logging in.</p>
  <div class="form-row cols-2">
    <div class="fld"><label>Select Client</label><select id="portal-client">${S.clients.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></div>
    <div class="fld"><label>Access Level</label><select id="portal-level"><option value="jobs">Jobs & Status only</option><option value="payments">Jobs + Payments</option><option value="full">Full</option></select></div>
  </div>
  <div style="display:flex;gap:8px"><button class="btn btn-primary" onclick="generatePortal()">🔗 Generate Portal</button><button class="btn btn-secondary" onclick="printPortalPage()">🖨 Print</button></div>
  <div id="portal-link-result" style="display:none;margin-top:12px;padding:10px 14px;background:var(--green-dim);border:1px solid rgba(34,197,94,.3);border-radius:var(--radius);font-size:12px"></div>
</div>
<div id="portal-preview-area"></div>`;
}
function generatePortal(){
  const cid=document.getElementById('portal-client')?.value,level=document.getElementById('portal-level')?.value;
  const cl=S.clients.find(x=>x.id==cid); if(!cl) return;
  const token=btoa(JSON.stringify({cid,level,ts:Date.now()}));
  const url=window.location.origin+window.location.pathname+'?portal='+token;
  const lr=document.getElementById('portal-link-result');
  if(lr){lr.style.display='block';lr.innerHTML=`<strong>Portal for ${cl.name}:</strong><br><span style="font-family:var(--mono);word-break:break-all;font-size:11px">${url}</span><div style="margin-top:8px;display:flex;gap:8px"><button class="btn btn-secondary btn-sm" onclick="navigator.clipboard.writeText('${url}').then(()=>toast('Copied!','success'))">📋 Copy</button><a href="https://wa.me/${(cl.phone||'').replace(/\D/g,'')}?text=${encodeURIComponent('Hi '+cl.name+', track your jobs: '+url)}" target="_blank" class="btn btn-sm" style="background:#25D366;color:#fff;border-color:#25D366">WhatsApp</a></div>`;}
  const pa=document.getElementById('portal-preview-area');
  if(pa) pa.innerHTML=renderPortalHTML(cl,S.jobs.filter(j=>j.client_id==cid),level);
}
function renderPortalHTML(cl,jobs,level){
  const tCharged=jobs.reduce((s,j)=>s+(j.amount||0),0),tPaid=jobs.filter(j=>j.paid).reduce((s,j)=>s+(j.amount||0),0),bal=tCharged-tPaid;
  const STAGES=['waiting','designing','approval','printing','fabrication','ready','installed','paid'];
  return `<div class="card" style="border:2px solid var(--accent)">
    <div style="background:var(--accent);color:#fff;margin:-16px -16px 16px;padding:16px;border-radius:4px 4px 0 0"><div style="font-size:18px;font-weight:900">QUICK PRINTS</div><div style="font-size:12px;opacity:.8">Client Portal — ${cl.name}</div></div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px">
      <div style="text-align:center;padding:10px;background:var(--bg3);border-radius:var(--radius)"><div style="font-size:11px;color:var(--text2)">Active Jobs</div><div style="font-size:20px;font-weight:700">${jobs.filter(j=>j.stage!=='paid').length}</div></div>
      <div style="text-align:center;padding:10px;background:var(--green-dim);border-radius:var(--radius)"><div style="font-size:11px;color:var(--green)">Total Paid</div><div style="font-size:16px;font-weight:700;color:var(--green)">${ksh(tPaid)}</div></div>
      <div style="text-align:center;padding:10px;background:${bal>0?'var(--red-dim)':'var(--green-dim)'};border-radius:var(--radius)"><div style="font-size:11px;color:${bal>0?'var(--red)':'var(--green)'}">Balance</div><div style="font-size:16px;font-weight:700;color:${bal>0?'var(--red)':'var(--green)'}">${ksh(bal)}</div></div>
    </div>
    ${jobs.map(j=>`<div style="border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px"><div><div style="font-size:13px;font-weight:700">${j.title}</div><div style="font-size:11px;color:var(--text2)">${j.id} · ${dateFmt(j.deadline)}</div></div>${stageBadge(j.stage)}</div>
      ${level!=='jobs'?`<div style="font-size:12px;margin-bottom:6px"><span style="color:var(--text2)">Amount: ${ksh(j.amount)}</span> · <span style="color:${j.paid?'var(--green)':'var(--red)'}">${j.paid?'✓ Paid':'Unpaid'}</span></div>`:''}
      <div style="height:5px;background:var(--bg4);border-radius:99px;overflow:hidden"><div style="height:100%;width:${Math.round((STAGES.indexOf(j.stage)+1)/STAGES.length*100)}%;background:var(--accent);border-radius:99px"></div></div>
    </div>`).join('')}
    <div style="text-align:center;font-size:10px;color:var(--text3);margin-top:10px">Quick Prints · Nairobi, Kenya</div>
  </div>`;
}
function printPortalPage(){
  const cid=document.getElementById('portal-client')?.value,level=document.getElementById('portal-level')?.value;
  const cl=S.clients.find(x=>x.id==cid); if(!cl){toast('Select a client first','error');return;}
  const w=window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html><head><title>Portal — ${cl.name}</title></head><body style="font-family:Arial,sans-serif;max-width:700px;margin:0 auto;padding:24px">${renderPortalHTML(cl,S.jobs.filter(j=>j.client_id==cid),level)}</body></html>`);
  w.document.close();w.focus();setTimeout(()=>w.print(),400);
}
// ============================================================
// STAFF PERFORMANCE
// ============================================================
function renderPerformance(){
  const month=new Date().toISOString().slice(0,7);
  return `
<div class="page-header"><div class="page-title">Staff Performance</div><div class="page-subtitle">${new Date().toLocaleDateString('en-KE',{month:'long',year:'numeric'})}</div></div>
<div class="grid-auto">
  ${S.staff.map(s=>{
    const myJobs=S.jobs.filter(j=>j.designer_id===s.id||j.sales_rep_id===s.id);
    const completed=myJobs.filter(j=>['installed','paid'].includes(j.stage)).length;
    const active=myJobs.filter(j=>!['installed','paid'].includes(j.stage)).length;
    const rev=S.salesLog.filter(sl=>sl.logged_by===s.name&&(sl.date||'').startsWith(month)).reduce((a,x)=>a+x.amount,0);
    return `<div class="card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">${avatarHtml(s.name,s.color)}<div><div style="font-weight:600;font-size:13px">${s.name}</div><div style="font-size:11px;color:var(--text3)">${s.role} · ${s.branch}</div></div></div>
      <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px"><span style="color:var(--text2)">Active Jobs</span><span style="font-weight:700;color:var(--accent)">${active}</span></div>
      <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px"><span style="color:var(--text2)">Completed</span><span style="font-weight:700;color:var(--green)">${completed}</span></div>
      <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:12px"><span style="color:var(--text2)">Sales This Month</span><span style="font-weight:700;font-family:var(--mono)">${ksh(rev)}</span></div>
    </div>`;
  }).join('')}
</div>`;
}
// ============================================================
// JOB PROFITABILITY
// ============================================================
function renderProfitability(){
  const jobs=S.branch!=='all'?S.jobs.filter(j=>j.branch===S.branch):S.jobs;
  const byCat={};
  [...new Set(jobs.map(j=>j.category||'Other'))].forEach(cat=>{
    const cj=jobs.filter(j=>(j.category||'Other')===cat);
    byCat[cat]={count:cj.length,revenue:cj.reduce((s,j)=>s+(j.amount||0),0),collected:cj.filter(j=>j.paid).reduce((s,j)=>s+(j.amount||0),0)};
  });
  const sorted=Object.entries(byCat).sort((a,b)=>b[1].revenue-a[1].revenue);
  return `
<div class="page-header"><div class="page-title">Job Profitability</div></div>
<div class="card"><div class="tbl-wrap"><table>
  <thead><tr><th>Category</th><th>Jobs</th><th>Revenue</th><th>Collected</th><th>Outstanding</th><th>Collection Rate</th></tr></thead>
  <tbody>${sorted.map(([cat,d])=>{const rate=d.revenue?Math.round(d.collected/d.revenue*100):0;return `<tr>
    <td style="font-weight:600">${cat}</td><td style="text-align:center;font-weight:700">${d.count}</td>
    <td style="font-family:var(--mono)">${ksh(d.revenue)}</td>
    <td style="font-family:var(--mono);color:var(--green)">${ksh(d.collected)}</td>
    <td style="font-family:var(--mono);color:${d.revenue-d.collected>0?'var(--red)':'var(--green)'}">${ksh(d.revenue-d.collected)}</td>
    <td><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;background:var(--bg4);border-radius:3px;height:8px;overflow:hidden"><div style="height:100%;width:${rate}%;background:${rate>=80?'var(--green)':rate>=50?'var(--yellow)':'var(--red)'};border-radius:3px"></div></div><span style="font-size:12px;font-weight:700;min-width:32px">${rate}%</span></div></td>
  </tr>`;}).join('')}</tbody>
</table></div></div>`;
}
// ============================================================
// VAT REPORT
// ============================================================
function renderVATReport(){
  const months=[];for(let i=0;i<6;i++){const d=new Date();d.setMonth(d.getMonth()-i);months.push(d.toISOString().slice(0,7));}
  const tVAT=months.reduce((s,m)=>{const rev=S.jobs.filter(j=>j.deadline&&j.deadline.startsWith(m)).reduce((a,j)=>a+(j.amount||0),0);return s+Math.round(rev*.16);},0);
  return `
<div class="page-header"><div class="page-title">VAT Report</div></div>
<div class="stat-card" style="margin-bottom:16px"><div class="stat-label">Total VAT (6 months)</div><div class="stat-value red">${ksh(tVAT)}</div></div>
<div class="card"><div class="tbl-wrap"><table>
  <thead><tr><th>Month</th><th>Taxable Sales</th><th>VAT Rate</th><th>VAT Amount</th><th>Total incl. VAT</th></tr></thead>
  <tbody>${months.map(m=>{const mj=S.jobs.filter(j=>j.deadline&&j.deadline.startsWith(m));const rev=mj.reduce((s,j)=>s+(j.amount||0),0);const vat=Math.round(rev*.16);return `<tr>
    <td style="font-weight:600">${m}</td><td style="font-family:var(--mono)">${ksh(rev)}</td><td style="text-align:center">16%</td>
    <td style="font-family:var(--mono);color:var(--red);font-weight:700">${ksh(vat)}</td>
    <td style="font-family:var(--mono);font-weight:700">${ksh(rev+vat)}</td>
  </tr>`;}).join('')}</tbody>
</table></div></div>`;
}

// ============================================================
// BOOT
// ============================================================
startup();



</script>
</body>
</html>
